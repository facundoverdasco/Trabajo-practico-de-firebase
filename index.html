<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agencias de viaje</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Agrega cualquier agencia de viaje</h1>
    <p>Ingresa su nombre</p>
    <input type="text" id="name">
    <p>Ingresa el nombre del hotel</p>
    <input type="text" id="hotel">
    <p>Ingresa su precio</p>
    <input type="text" id="precio">
    <p>Ingresa su destino</p>
    <input type="text" id="destino">
    <input type="button" value="Guardar" id="Guardar">
    <h2>Agencias registradas</h2>
    <table border="2">
        <thead>
            <tr>
                <th>Agencia</th>
                <th>Hotel</th>
                <th>Destino</th>
                <th>Precio</th>
            </tr>
        </thead>
        <tbody id="tabla">
        </tbody>
    </table>
    <script src="index.js" type="module"></script>
</body>
</html>
